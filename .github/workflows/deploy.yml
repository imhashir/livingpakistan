name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for AWS OIDC

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # the deploy role trusts only this environment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          # playwright is only used by the local screenshot/verify scripts
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Upload order matters: assets and data land before index.html, so a
      # visitor never gets an index.html referencing files that aren't up yet.
      - name: Upload hashed assets (immutable)
        run: |
          aws s3 sync dist/assets s3://${{ secrets.AWS_S3_BUCKET }}/assets \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload data (unhashed, short cache)
        run: |
          aws s3 sync dist/data s3://${{ secrets.AWS_S3_BUCKET }}/data \
            --delete \
            --cache-control "public,max-age=300"

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "public,max-age=0,no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
